<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>결산 요약 관리</title><link rel="stylesheet" href="../assets/css/app.css?v=2.5"><link rel="stylesheet" href="../assets/css/finance.css?v=3.6"></head><body class="admin-page"><header class="topbar"><div class="wrap"><div class="brand-block"><a class="brand" data-brand href="../index.html">우경경로당</a><div class="small">관리자</div></div><nav class="top-actions"></nav></div></header><main class="wrap page-wrap"><section class="page-title"><h1>결산 요약 관리</h1><p>PDF 결산서의 합계를 직접 대조한 후 등록합니다. 거래별 상세내역·기부자 명단·계좌정보는 입력하지 않습니다.</p></section><section class="settings-panel"><form id="finance-form"><div class="admin-form-grid"><label>결산연도<input id="f-year" type="number" min="2000" max="2099" value="2025" required></label><label>구분<select id="f-kind"><option value="own">자체경비</option><option value="operation">운영비</option><option value="heating">냉난방비</option></select></label><label>전기 이월액(원)<input id="f-opening" type="number" min="0" step="1" required></label><label>수입 합계(원)<input id="f-income" type="number" min="0" step="1" required></label><label>지출 합계(원)<input id="f-expense" type="number" min="0" step="1" required></label><label>차기 이월액(원)<input id="f-closing" type="number" min="0" step="1" required></label><label class="wide"><input type="checkbox" id="f-published"> 공개 홈페이지에 합계만 게시 (선택 시 공개)</label></div><p id="finance-balance" class="finance-note"></p><div class="toolbar"><button type="submit" class="btn primary">저장</button><span id="finance-message" role="status"></span></div></form></section><section class="settings-panel"><h2>등록된 결산 요약</h2><div id="finance-admin-list"></div></section><section class="settings-panel"><h2>원본 및 영수증 관리</h2><p>영수증은 기존 <a href="files.html">문서·사진·영수증 관리</a>에서 <strong>영수증·증빙</strong>으로 등록하면 관리자 전용으로 보관됩니다. 금품·물품 수납부와 거래원장은 공개 결산 요약에 첨부하지 마십시오.</p></section></main><script src="../assets/js/common.js?v=1.1"></script><script src="../assets/js/admin-auth.js?v=1.3"></script><script src="../assets/js/admin-finance.js?v=3.6"></script></body></html>
