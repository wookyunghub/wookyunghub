<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/css/app.css?v=1.3"><title>기본 설정</title></head><body class="admin-page"><header class="topbar"><div class="wrap"><div class="brand-block"><a class="brand" data-brand href="../index.html">우경경로당</a><div class="small">관리자</div></div><nav class="top-actions" aria-label="주 메뉴"></nav></div></header><main class="wrap page-wrap"><section class="page-title"><span class="badge admin-badge">관리자</span><h1>기본 설정</h1><p>조직명과 상위 소속을 구분하여 관리합니다. 상단에는 조직명만 표시합니다.</p></section><section class="settings-panel"><div class="admin-form-grid"><label>조직명<input id="s-org" maxlength="100" placeholder="예시) 우경경로당"></label><label>소속 기관<input id="s-parent" maxlength="200" placeholder="예시) (사)대한노인회 진천군지회"></label><label>소속 분회<input id="s-branch" maxlength="100" placeholder="예시) 문백·영동분회"></label><label>최신 운영대장 기간<input id="s-period"></label><label class="wide">사이트 제목<input id="s-title"></label><label>링크 모드<select id="s-mode"><option value="preview">개발 미리보기</option><option value="public">공개 홈페이지</option><option value="none">사용 안 함</option></select></label><label>공개 URL<input id="s-public"></label><label class="wide">경로당 로고 이미지<div style="display:flex;gap:8px;align-items:center;margin-top:4px"><input id="s-logo" placeholder="예시) assets/img/logo.png" style="flex:1"><label class="btn" style="cursor:pointer;white-space:nowrap;margin:0">파일 선택<input type="file" id="s-logo-file" accept="image/*" hidden></label></div><div id="s-logo-preview-box" style="margin-top:8px;display:flex;align-items:center;gap:12px;background:#fdfcf9;border:1px solid #dcd4c8;padding:8px 12px;border-radius:8px"><img id="s-logo-preview" src="../assets/img/logo.png" alt="로고 미리보기" style="width:50px;height:50px;object-fit:contain;background:#fff;border:1px solid #e0d8cc;border-radius:6px;padding:3px"><span class="small" style="color:#665e55">홈페이지 우측 상단 브랜드/슬로건에 표시되는 로고 이미지</span></div></label><label class="wide">건물 전경 사진 (첫화면 상단 배경)<div style="display:flex;gap:8px;align-items:center;margin-top:4px"><input id="s-building" placeholder="예시) assets/img/building.jpg" style="flex:1"><label class="btn" style="cursor:pointer;white-space:nowrap;margin:0">파일 선택<input type="file" id="s-building-file" accept="image/*" hidden></label></div><div id="s-building-preview-box" style="margin-top:8px;display:flex;align-items:center;gap:12px;background:#fdfcf9;border:1px solid #dcd4c8;padding:8px 12px;border-radius:8px"><img id="s-building-preview" src="../assets/img/building.jpg" alt="건물사진 미리보기" style="width:80px;height:55px;object-fit:cover;background:#fff;border:1px solid #e0d8cc;border-radius:6px"><span class="small" style="color:#665e55">홈페이지 첫 화면 상단(Hero) 배경으로 은은하게 적용되는 전경 사진</span></div></label></div><button id="s-save" class="btn primary">저장</button><p id="s-msg" class="small"></p></section></main><footer class="footer"><div class="wrap"><span data-brand>우경경로당</span> · 경로당 홈페이지</div></footer><script src="../assets/js/common.js?v=1.1"></script><script src="../assets/js/admin-auth.js?v=1.3"></script><script src="../assets/js/admin-settings.js?v=5.50"></script></body></html>
