<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../assets/css/app.css?v=1.3">
  <title>기본 설정</title>
  <style>
    .settings-container {
      max-width: 820px;
      margin: 0 auto;
    }
    .settings-group-card {
      background: #ffffff;
      border: 1px solid #e2d9cd;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 14px;
      box-shadow: 0 2px 7px rgba(70,50,30,0.04);
    }
    .settings-group-title {
      font-size: 14.5px;
      font-weight: 800;
      color: #3b2e22;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid #f0e9df;
      padding-bottom: 8px;
    }
    .settings-group-title small {
      font-size: 12px;
      color: #837262;
      font-weight: 500;
      margin-left: 4px;
    }
    .compact-form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 16px;
    }
    .compact-form-grid .full-col {
      grid-column: 1 / -1;
    }
    .compact-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .compact-field label {
      font-size: 12.5px;
      font-weight: 700;
      color: #4a3e33;
      margin: 0;
    }
    .compact-field input[type="text"],
    .compact-field input:not([type]) {
      width: 100%;
      height: 36px;
      padding: 6px 11px;
      font-size: 13.5px;
      border: 1px solid #c9bea8;
      border-radius: 7px;
      box-sizing: border-box;
      background: #faf8f5;
      color: #241c15;
      transition: all .15s ease;
    }
    .compact-field input:focus {
      background: #ffffff;
      border-color: #526c49;
      outline: none;
      box-shadow: 0 0 0 2px rgba(82,108,73,0.18);
    }
    .compact-field input::placeholder {
      font-size: 12px;
      color: #a89a8b;
    }

    /* 이미지 업로드 1줄 가로형 컴팩트 */
    .img-upload-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fdfbf7;
      border: 1px solid #e7ded2;
      border-radius: 8px;
      padding: 6px 10px;
    }
    .img-thumb-preview {
      width: 44px;
      height: 44px;
      object-fit: contain;
      background: #fff;
      border: 1px solid #ddd2c4;
      border-radius: 6px;
      padding: 2px;
      flex: 0 0 auto;
    }
    .img-thumb-bld {
      width: 64px;
      height: 44px;
      object-fit: cover;
    }
    .img-input-wrap {
      flex: 1;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .img-path-input {
      flex: 1;
      height: 34px !important;
      font-size: 12.5px !important;
      padding: 5px 9px !important;
    }
    .btn-file-select {
      height: 34px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12.5px;
      font-weight: 700;
      color: #4a3e33;
      background: #f4eee6;
      border: 1px solid #cfc2b2;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: all .15s ease;
      margin: 0;
    }
    .btn-file-select:hover {
      background: #e9e0d4;
    }
    .img-help-text {
      font-size: 11.5px;
      color: #857464;
      margin: 3px 0 0;
    }

    /* 하단 저장 바 */
    .compact-save-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      padding: 12px 18px;
      background: #fcfaf6;
      border: 1px solid #e4dacd;
      border-radius: 10px;
    }
    .compact-save-bar .btn-save {
      font-size: 14px;
      padding: 8px 26px;
      border-radius: 8px;
      font-weight: 700;
    }
    @media(max-width: 640px) {
      .compact-form-grid {
        grid-template-columns: 1fr;
      }
      .img-upload-row {
        flex-direction: column;
        align-items: stretch;
      }
      .img-thumb-preview {
        align-self: flex-start;
      }
    }
  </style>
</head>
<body class="admin-page">
<header class="topbar">
  <div class="wrap">
    <div class="brand-block">
      <a class="brand" data-brand href="../index.html">우경경로당</a>
      <div class="small">관리자</div>
    </div>
    <nav class="top-actions" aria-label="주 메뉴"></nav>
  </div>
</header>

<main class="wrap page-wrap">
  <section class="page-title">
    <span class="badge admin-badge">관리자</span>
    <h1>기본 설정</h1>
    <p>경로당 기본 정보, 홈페이지 설정, 오시는 길 및 대표 이미지를 관리합니다.</p>
  </section>

  <div class="settings-container">
    <!-- 1. 기관 기본 정보 -->
    <section class="settings-group-card">
      <h2 class="settings-group-title">
        <span>🏛️ 기관 기본 정보</span>
        <small>조직명과 상위 소속 정보</small>
      </h2>
      <div class="compact-form-grid">
        <div class="compact-field">
          <label for="s-org">조직명</label>
          <input id="s-org" maxlength="100" placeholder="예시) 우경경로당">
        </div>
        <div class="compact-field">
          <label for="s-period">최신 운영대장 기간</label>
          <input id="s-period" placeholder="예시) 2025-2026">
        </div>
        <div class="compact-field">
          <label for="s-parent">소속 기관</label>
          <input id="s-parent" maxlength="200" placeholder="예시) (사)대한노인회 진천군지회">
        </div>
        <div class="compact-field">
          <label for="s-branch">소속 분회</label>
          <input id="s-branch" maxlength="100" placeholder="예시) 문백·영동분회">
        </div>
      </div>
    </section>

    <!-- 2. 홈페이지 & 오시는 길 -->
    <section class="settings-group-card">
      <h2 class="settings-group-title">
        <span>🌐 홈페이지 및 오시는 길</span>
        <small>사이트 제목과 지도 연결</small>
      </h2>
      <div class="compact-form-grid">
        <div class="compact-field">
          <label for="s-title">사이트 제목</label>
          <input id="s-title" placeholder="예시) 우경경로당 홈페이지">
        </div>
        <div class="compact-field">
          <label for="s-public">공개 홈페이지 URL <small style="font-weight:400;color:#888;">(선택)</small></label>
          <input id="s-public" placeholder="예시) https://wookyung.pages.dev">
        </div>
        <div class="compact-field full-col">
          <label for="s-map">오시는 길 지도 연결 URL <small style="font-weight:400;color:#888;">(네이버/카카오/티맵 공유 링크, 미입력 시 기본 지도 자동 연결)</small></label>
          <input id="s-map" placeholder="예시) https://map.naver.com/... 또는 https://kko.to/...">
        </div>
      </div>
    </section>

    <!-- 3. 대표 이미지 관리 (로고 및 건물 사진) -->
    <section class="settings-group-card">
      <h2 class="settings-group-title">
        <span>🖼️ 대표 이미지 관리</span>
        <small>로고 및 첫 화면 전경 사진</small>
      </h2>
      <div class="compact-form-grid">
        <!-- 로고 -->
        <div class="compact-field full-col">
          <label>경로당 로고 이미지</label>
          <div class="img-upload-row">
            <img id="s-logo-preview" class="img-thumb-preview" src="../assets/img/logo.png" alt="로고 미리보기">
            <div class="img-input-wrap">
              <input id="s-logo" class="img-path-input" placeholder="assets/img/logo.png">
              <label class="btn-file-select">파일 선택<input type="file" id="s-logo-file" accept="image/*" hidden></label>
            </div>
          </div>
          <div class="img-help-text">홈페이지 상단 브랜드 및 슬로건 옆에 표시되는 대표 로고</div>
        </div>

        <!-- 건물 사진 -->
        <div class="compact-field full-col" style="margin-top:6px;">
          <label>건물 전경 사진</label>
          <div class="img-upload-row">
            <img id="s-building-preview" class="img-thumb-preview img-thumb-bld" src="../assets/img/building.jpg" alt="건물사진 미리보기">
            <div class="img-input-wrap">
              <input id="s-building" class="img-path-input" placeholder="assets/img/building.jpg">
              <label class="btn-file-select">파일 선택<input type="file" id="s-building-file" accept="image/*" hidden></label>
            </div>
          </div>
          <div class="img-help-text">홈페이지 첫 화면 상단(Hero) 배경으로 은은하게 적용되는 전경 사진</div>
        </div>
      </div>
    </section>

    <!-- 하단 저장 바 -->
    <div class="compact-save-bar">
      <span id="s-msg" class="small" style="font-weight:600;color:#526c49;"></span>
      <button id="s-save" class="btn primary btn-save">기본 설정 저장</button>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="wrap">
    <span data-brand>우경경로당</span> · 경로당 홈페이지 관리자
  </div>
</footer>

<script src="../assets/js/common.js?v=1.8"></script>
<script src="../assets/js/admin-auth.js?v=1.3"></script>
<script src="../assets/js/admin-settings.js?v=5.70"></script>
</body>
</html>
