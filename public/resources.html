<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="assets/css/app.css?v=2.5">
  <link rel="stylesheet" href="assets/css/site-theme.css?v=5.80">
  <title>자료실 · 우경경로당</title>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand-block">
      <a class="brand" data-brand href="index.html">우경경로당</a>
      <div class="small">함께하는 경로당 홈페이지</div>
    </div>
    <nav class="top-actions" aria-label="주 메뉴"></nav>
  </div>
</header>
<main class="wrap page-wrap">
  <section class="page-title">
    <span class="eyebrow">자료실</span>
    <h1>자료실</h1>
    <p>경로당 서식자료, 일반문서와 활동 사진을 열람하고 다운로드할 수 있습니다.</p>
  </section>

  <!-- 자료실 탭 메뉴: 전체/서식/문서/사진 -->
  <!-- 자료실 상단 컨트롤 바: 탭 메뉴 & 실시간 검색창 -->
  <div class="res-control-bar">
    <nav class="res-nav-tabs" role="tablist" aria-label="자료실 분류 탭">
      <button type="button" class="res-nav-tab active" data-tab="all" role="tab" aria-selected="true">
        <span class="tab-icon">📑</span><span class="tab-label">전체</span>
      </button>
      <button type="button" class="res-nav-tab" data-tab="forms" role="tab" aria-selected="false">
        <span class="tab-icon">📋</span><span class="tab-label">서식</span>
      </button>
      <button type="button" class="res-nav-tab" data-tab="docs" role="tab" aria-selected="false">
        <span class="tab-icon">📄</span><span class="tab-label">문서</span>
      </button>
      <button type="button" class="res-nav-tab" data-tab="photos" role="tab" aria-selected="false">
        <span class="tab-icon">📷</span><span class="tab-label">사진</span>
      </button>
    </nav>
    <form class="res-search-form" id="res-search-form" onsubmit="return false;">
      <input type="search" id="res-search-input" class="res-search-input" placeholder="서식명, 문서 제목, 파일명 검색..." aria-label="자료 검색">
      <button type="button" id="res-search-clear" class="res-search-clear" title="검색 지우기" hidden>✕</button>
      <button type="button" id="res-search-submit" class="res-search-btn" title="검색 실행">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>
      </button>
    </form>
  </div>

  <!-- 1. 서식 섹션 -->
  <section id="section-forms" class="content-panel res-section">
    <div class="section-heading-row">
      <div>
        <h2>서식자료</h2>
        <p class="section-help" style="margin:2px 0 0">경로당 운영, 회원 신청, 회의 등에 필요한 공식 서식을 열람하고 다운로드할 수 있습니다. <b>(이름순 정렬)</b></p>
      </div>
      <span id="forms-count" class="badge">0건</span>
    </div>
    <div id="resource-forms" class="resource-grid"></div>
  </section>

  <!-- 2. 문서 섹션 -->
  <section id="section-docs" class="content-panel res-section">
    <div class="section-heading-row">
      <div>
        <h2>일반문서</h2>
        <p class="section-help" style="margin:2px 0 0">회의록, 보고서 등 경로당 운영 일반 공개 문서입니다. <b>(연도별 최신순)</b></p>
      </div>
      <span id="docs-count" class="badge">0건</span>
    </div>
    <div id="resource-docs" class="res-grouped-wrap"></div>
  </section>

  <!-- 3. 사진 섹션 -->
  <section id="section-photos" class="content-panel res-section">
    <div class="section-heading-row">
      <div>
        <h2>사진자료</h2>
        <p class="section-help" style="margin:2px 0 0">경로당 행사 및 주요 활동 사진입니다. 사진을 클릭하면 크게 볼 수 있습니다. <b>(연도별 최신순)</b></p>
      </div>
      <span id="photos-count" class="badge">0건</span>
    </div>
    <div id="resource-photos" class="res-grouped-wrap"></div>
  </section>

  <!-- 사진 상세보기 모달 다이얼로그 -->
  <dialog id="photo-dialog" class="photo-viewer">
    <div class="photo-viewer-head">
      <div>
        <strong id="photo-dialog-title">사진 미리보기</strong>
      </div>
      <div class="photo-viewer-actions">
        <a id="photo-dialog-download" class="btn" href="" download target="_blank" rel="noopener">원본 다운로드</a>
        <button type="button" class="btn" id="photo-dialog-close">닫기</button>
      </div>
    </div>
    <div class="photo-viewer-toolbar">
      <button type="button" class="btn" id="photo-zoom-out">축소</button>
      <button type="button" class="btn" id="photo-zoom-in">확대</button>
      <button type="button" class="btn" id="photo-rotate-left">왼쪽 회전</button>
      <button type="button" class="btn" id="photo-rotate-right">오른쪽 회전</button>
      <button type="button" class="btn" id="photo-reset">원래 크기</button>
    </div>
    <div class="photo-viewer-stage">
      <img id="photo-dialog-img" src="" alt="사진 크게 보기" loading="lazy">
    </div>
    <div class="photo-viewer-help photo-dialog-foot">
      <span id="photo-dialog-desc"></span>
    </div>
  </dialog>
</main>
<footer class="footer"><div class="wrap"><span data-brand>우경경로당</span> · 경로당 홈페이지</div></footer>
<script src="assets/js/common.js?v=1.8"></script>
<script src="assets/js/resource-order.js?v=5.66"></script>
<script src="assets/js/resources.js?v=5.90"></script>
</body>
</html>
